<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solo Travel Cam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior-y: none; user-select: none; -webkit-user-select: none; }
        video::-webkit-media-controls { display: none !important; }
        video { pointer-events: none; } 
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden flex flex-col">

    <!-- Top Bar -->
    <div class="text-center p-4 text-sm font-bold bg-black shadow-md z-20" id="headerText">
        Step 1: Capture Monument (Back Camera)
    </div>

    <!-- Main Workspace -->
    <div class="relative flex-grow w-full h-full flex items-center justify-center bg-black overflow-hidden" id="workspace">
        
        <!-- Live Camera -->
        <video id="cameraFeed" class="absolute w-full h-full object-cover" autoplay playsinline muted disablePictureInPicture></video>
        
        <!-- Editor View -->
        <div id="editorView" class="relative w-full h-full hidden">
            <img id="bgImage" class="absolute w-full h-full object-cover" src="" alt="Background">
            
            <div id="overlayContainer" class="absolute top-8 left-8 w-32 h-32 border-[3px] border-white shadow-2xl touch-none rounded-full overflow-hidden flex items-center justify-center bg-black" style="touch-action: none;">
                <img id="overlayImage" class="w-full h-full object-cover" src="" alt="Selfie">
            </div>
        </div>
    </div>

    <!-- Controls Area -->
    <div class="bg-black p-4 pb-8 flex flex-col justify-center items-center z-20 gap-4" id="controlsArea">
        <button id="captureBtn" class="bg-white text-black w-16 h-16 rounded-full border-4 border-gray-400 focus:outline-none shadow-lg active:scale-95 transition-transform"></button>
        
        <div id="editorControls" class="hidden w-full flex flex-col gap-4 px-2">
            <!-- Resize Slider -->
            <div class="flex items-center justify-between gap-3 bg-gray-800 p-2 rounded-lg">
                <span class="text-xs text-gray-300">Size</span>
                <input type="range" id="sizeSlider" min="60" max="250" value="128" class="flex-grow accent-blue-500">
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-between items-center w-full gap-2">
                <button id="toggleShapeBtn" class="bg-gray-700 text-xs text-white px-3 py-3 rounded-lg flex-1 font-semibold">Make Square</button>
                <button id="saveBtn" class="bg-blue-600 text-sm font-bold text-white px-4 py-3 rounded-lg flex-1 shadow-lg active:bg-blue-700">Save</button>
                <button id="retakeBtn" class="bg-red-600 text-xs text-white px-3 py-3 rounded-lg flex-1 font-semibold">Retake</button>
            </div>
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('cameraFeed');
        const captureBtn = document.getElementById('captureBtn');
        const headerText = document.getElementById('headerText');
        const editorView = document.getElementById('editorView');
        const bgImage = document.getElementById('bgImage');
        const overlayContainer = document.getElementById('overlayContainer');
        const overlayImage = document.getElementById('overlayImage');
        const editorControls = document.getElementById('editorControls');
        const toggleShapeBtn = document.getElementById('toggleShapeBtn');
        const saveBtn = document.getElementById('saveBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const sizeSlider = document.getElementById('sizeSlider');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const workspace = document.getElementById('workspace');

        let currentStream = null;
        let step = 1; 
        let isCircle = true;

        // Simple Camera Logic - Removed all resolution constraints
        async function startCamera(facingMode) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode },
                    audio: false
                });
                video.srcObject = currentStream;
                video.muted = true;
                video.play().catch(e => console.log(e));
            } catch (err) {
                alert("Camera access denied or failed: " + err.message);
            }
        }

        // Initialize directly with Back Camera
        startCamera('environment');

        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.95);

            if (step === 1) {
                bgImage.src = imageDataUrl;
                step = 2;
                headerText.innerText = "Step 2: Capture Selfie (Front Camera)";
                startCamera('user');
            } else if (step === 2) {
                overlayImage.src = imageDataUrl;
                step = 3;
                
                if (currentStream) currentStream.getTracks().forEach(track => track.stop());
                
                video.classList.add('hidden');
                captureBtn.classList.add('hidden');
                editorView.classList.remove('hidden');
                editorControls.classList.remove('hidden');
                headerText.innerText = "Step 3: Adjust & Save";
            }
        });

        retakeBtn.addEventListener('click', () => {
            step = 1;
            editorView.classList.add('hidden');
            editorControls.classList.add('hidden');
            video.classList.remove('hidden');
            captureBtn.classList.remove('hidden');
            headerText.innerText = "Step 1: Capture Monument (Back Camera)";
            startCamera('environment');
        });

        toggleShapeBtn.addEventListener('click', () => {
            isCircle = !isCircle;
            if (isCircle) {
                overlayContainer.classList.add('rounded-full');
                overlayContainer.classList.remove('rounded-xl');
                toggleShapeBtn.innerText = "Make Square";
            } else {
                overlayContainer.classList.remove('rounded-full');
                overlayContainer.classList.add('rounded-xl');
                toggleShapeBtn.innerText = "Make Circle";
            }
        });

        sizeSlider.addEventListener('input', (e) => {
            overlayContainer.style.width = `${e.target.value}px`;
            overlayContainer.style.height = `${e.target.value}px`;
        });

        // Touch Dragging Logic
        let isDragging = false;
        let offsetX, offsetY;

        overlayContainer.addEventListener('pointerdown', (e) => {
            isDragging = true;
            const rect = overlayContainer.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            overlayContainer.setPointerCapture(e.pointerId);
        });

        overlayContainer.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const workspaceRect = workspace.getBoundingClientRect();
            let newX = e.clientX - workspaceRect.left - offsetX;
            let newY = e.clientY - workspaceRect.top - offsetY;
            newX = Math.max(0, Math.min(newX, workspaceRect.width - overlayContainer.offsetWidth));
            newY = Math.max(0, Math.min(newY, workspaceRect.height - overlayContainer.offsetHeight));
            overlayContainer.style.left = `${newX}px`;
            overlayContainer.style.top = `${newY}px`;
        });

        overlayContainer.addEventListener('pointerup', (e) => {
            isDragging = false;
            overlayContainer.releasePointerCapture(e.pointerId);
        });

        // Save Logic (with Distortion Fix)
        saveBtn.addEventListener('click', () => {
            headerText.innerText = "Processing...";
            
            const IW = bgImage.naturalWidth;
            const IH = bgImage.naturalHeight;
            canvas.width = IW;
            canvas.height = IH;

            const CW = workspace.clientWidth;
            const CH = workspace.clientHeight;
            const CA = CW / CH;
            const IA = IW / IH;
            
            let renderedW, renderedH, renderOffsetX, renderOffsetY;
            if (CA > IA) { 
                renderedW = CW; renderedH = CW / IA; renderOffsetX = 0; renderOffsetY = (CH - renderedH) / 2;
            } else { 
                renderedH = CH; renderedW = CH * IA; renderOffsetX = (CW - renderedW) / 2; renderOffsetY = 0;
            }

            const scale = IW / renderedW;
            ctx.drawImage(bgImage, 0, 0, IW, IH);

            const workspaceRect = workspace.getBoundingClientRect();
            const overlayRect = overlayContainer.getBoundingClientRect();
            const domX = overlayRect.left - workspaceRect.left;
            const domY = overlayRect.top - workspaceRect.top;

            const finalX = (domX - renderOffsetX) * scale;
            const finalY = (domY - renderOffsetY) * scale;
            const finalW = overlayRect.width * scale;
            const finalH = overlayRect.height * scale;

            ctx.save();
            if (isCircle) {
                ctx.beginPath();
                ctx.arc(finalX + finalW/2, finalY + finalH/2, finalW/2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
            } else {
                const radius = 24 * scale;
                ctx.beginPath();
                ctx.moveTo(finalX + radius, finalY);
                ctx.lineTo(finalX + finalW - radius, finalY);
                ctx.quadraticCurveTo(finalX + finalW, finalY, finalX + finalW, finalY + radius);
                ctx.lineTo(finalX + finalW, finalY + finalH - radius);
                ctx.quadraticCurveTo(finalX + finalW, finalY + finalH, finalX + finalW - radius, finalY + finalH);
                ctx.lineTo(finalX + radius, finalY + finalH);
                ctx.quadraticCurveTo(finalX, finalY + finalH, finalX, finalY + finalH - radius);
                ctx.lineTo(finalX, finalY + radius);
                ctx.quadraticCurveTo(finalX, finalY, finalX + radius, finalY);
                ctx.closePath();
                ctx.clip();
            }

            const SW = overlayImage.naturalWidth;
            const SH = overlayImage.naturalHeight;
            const SA = SW / SH;
            const TA = finalW / finalH; 

            let sx, sy, sw, sh;
            if (TA > SA) { sw = SW; sh = SW / TA; sx = 0; sy = (SH - sh) / 2; } 
            else { sh = SH; sw = SH * TA; sx = (SW - sw) / 2; sy = 0; }

            ctx.drawImage(overlayImage, sx, sy, sw, sh, finalX, finalY, finalW, finalH);
            
            ctx.lineWidth = 6 * scale; 
            ctx.strokeStyle = "white";
            ctx.stroke();
            ctx.restore();

            canvas.toBlob((blob) => {
                if (!blob) return;
                const file = new File([blob], "solo-travel.jpg", { type: "image/jpeg" });
                
                if (navigator.share) {
                    navigator.share({ title: 'Solo Travel Snap', files: [file] })
                    .then(() => headerText.innerText = "Step 3: Adjust & Save")
                    .catch(console.error);
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'solo-travel.jpg';
                    document.body.appendChild(a);
                    a.click();
                    URL.revokeObjectURL(url);
                }
            }, 'image/jpeg', 0.95);
        });
    </script>
</body>
</html>
