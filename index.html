<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solo Travel Cam Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior-y: none; user-select: none; -webkit-user-select: none; }
        video::-webkit-media-controls { display: none !important; }
        video { pointer-events: none; } 
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden flex flex-col">

    <!-- Top Bar: Status & Resolution -->
    <div class="flex justify-between items-center p-3 bg-black shadow-md z-20" id="topBar">
        <div class="text-sm font-bold" id="headerText">Step 1: Back Camera</div>
        
        <!-- Resolution Selector (Visible only in Step 1) -->
        <select id="resSelect" class="bg-gray-800 text-white text-xs px-2 py-1 rounded border border-gray-600 outline-none">
            <option value="1080">1080p (FHD)</option>
            <option value="720">720p (HD)</option>
            <option value="2160">4K (UHD)</option>
        </select>
    </div>

    <!-- Main Working Area -->
    <div class="relative flex-grow w-full h-full flex items-center justify-center bg-black overflow-hidden" id="workspace">
        
        <!-- Live Camera Feed -->
        <video id="cameraFeed" class="absolute w-full h-full object-cover" autoplay playsinline muted disablePictureInPicture></video>
        
        <!-- Editor View (Hidden initially) -->
        <div id="editorView" class="relative w-full h-full hidden">
            <!-- Background Image -->
            <img id="bgImage" class="absolute w-full h-full object-cover" src="" alt="Background">
            
            <!-- Draggable & Resizable Overlay Image (Selfie) -->
            <div id="overlayContainer" class="absolute top-8 left-8 w-32 h-32 border-[3px] border-white shadow-2xl touch-none rounded-full overflow-hidden flex items-center justify-center bg-black" style="touch-action: none;">
                <img id="overlayImage" class="w-full h-full object-cover" src="" alt="Selfie">
            </div>
        </div>
    </div>

    <!-- Controls Area -->
    <div class="bg-black p-4 pb-8 flex flex-col justify-center items-center z-20 gap-4" id="controlsArea">
        
        <!-- Capture Button for Camera -->
        <button id="captureBtn" class="bg-white text-black w-16 h-16 rounded-full border-4 border-gray-400 focus:outline-none shadow-lg active:scale-95 transition-transform"></button>
        
        <!-- Editor Controls (Hidden initially) -->
        <div id="editorControls" class="hidden w-full flex flex-col gap-4 px-2">
            
            <!-- Resize Slider -->
            <div class="flex items-center justify-between gap-3 bg-gray-800 p-2 rounded-lg">
                <span class="text-xs text-gray-300">Size</span>
                <input type="range" id="sizeSlider" min="60" max="250" value="128" class="flex-grow accent-blue-500">
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-between items-center w-full gap-2">
                <button id="toggleShapeBtn" class="bg-gray-700 text-xs text-white px-3 py-3 rounded-lg flex-1 font-semibold">Make Square</button>
                <button id="saveBtn" class="bg-blue-600 text-sm font-bold text-white px-4 py-3 rounded-lg flex-1 shadow-lg active:bg-blue-700">Save</button>
                <button id="retakeBtn" class="bg-red-600 text-xs text-white px-3 py-3 rounded-lg flex-1 font-semibold">Retake</button>
            </div>
        </div>
    </div>

    <!-- Hidden Canvas for Processing -->
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('cameraFeed');
        const captureBtn = document.getElementById('captureBtn');
        const headerText = document.getElementById('headerText');
        const editorView = document.getElementById('editorView');
        const bgImage = document.getElementById('bgImage');
        const overlayContainer = document.getElementById('overlayContainer');
        const overlayImage = document.getElementById('overlayImage');
        const editorControls = document.getElementById('editorControls');
        const toggleShapeBtn = document.getElementById('toggleShapeBtn');
        const saveBtn = document.getElementById('saveBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const resSelect = document.getElementById('resSelect');
        const sizeSlider = document.getElementById('sizeSlider');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const workspace = document.getElementById('workspace');

        let currentStream = null;
        let step = 1; 
        let isCircle = true;
        let facingMode = 'environment'; // default back camera

        // Get Resolution Constraints
        function getConstraints(mode) {
            const heightTarget = parseInt(resSelect.value); // 720, 1080, 2160
            // For mobile, width/height is often flipped (portrait orientation)
            // Using 'ideal' lets iOS fallback to nearest supported resolution if 4K isn't available
            return {
                video: {
                    facingMode: mode,
                    height: { ideal: heightTarget }
                },
                audio: false
            };
        }

        // Start Camera Function
        async function startCamera(mode) {
            facingMode = mode;
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(getConstraints(mode));
                video.srcObject = currentStream;
            } catch (err) {
                alert("Camera access issue: " + err.message);
            }
        }

        // Handle Resolution Change
        resSelect.addEventListener('change', () => {
            if (step === 1) startCamera('environment');
        });

        // Initialize
        startCamera('environment');

        // Capture Logic
        captureBtn.addEventListener('click', () => {
            // Match canvas to exact video track dimensions to avoid distortion
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.95);

            if (step === 1) {
                bgImage.src = imageDataUrl;
                step = 2;
                headerText.innerText = "Step 2: Front Camera";
                resSelect.classList.add('hidden'); // Hide resolution dropdown
                startCamera('user');
            } else if (step === 2) {
                overlayImage.src = imageDataUrl;
                step = 3;
                
                if (currentStream) currentStream.getTracks().forEach(track => track.stop());
                
                video.classList.add('hidden');
                captureBtn.classList.add('hidden');
                editorView.classList.remove('hidden');
                editorControls.classList.remove('hidden');
                headerText.innerText = "Step 3: Adjust & Save";
            }
        });

        // Retake Logic
        retakeBtn.addEventListener('click', () => {
            step = 1;
            editorView.classList.add('hidden');
            editorControls.classList.add('hidden');
            video.classList.remove('hidden');
            captureBtn.classList.remove('hidden');
            resSelect.classList.remove('hidden');
            headerText.innerText = "Step 1: Back Camera";
            startCamera('environment');
        });

        // Toggle Shape
        toggleShapeBtn.addEventListener('click', () => {
            isCircle = !isCircle;
            if (isCircle) {
                overlayContainer.classList.add('rounded-full');
                overlayContainer.classList.remove('rounded-xl');
                toggleShapeBtn.innerText = "Make Square";
            } else {
                overlayContainer.classList.remove('rounded-full');
                overlayContainer.classList.add('rounded-xl');
                toggleShapeBtn.innerText = "Make Circle";
            }
        });

        // Resize Overlay Logic
        sizeSlider.addEventListener('input', (e) => {
            const size = e.target.value;
            overlayContainer.style.width = `${size}px`;
            overlayContainer.style.height = `${size}px`;
        });

        // Dragging Logic (PointerEvents for smooth iOS touch)
        let isDragging = false;
        let offsetX, offsetY;

        overlayContainer.addEventListener('pointerdown', (e) => {
            isDragging = true;
